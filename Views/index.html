<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Socket Chat</title>

    <!-- Socket.IO Client -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="/style.css">

</head>


<body>

    <!-- ================================= -->
    <!-- Username Modal                    -->
    <!-- ================================= -->

    <div class="username-overlay" id="username-overlay">

        <div class="username-card">

            <div class="logo-circle">
                💬
            </div>

            <h1>Welcome to Chat</h1>

            <p>
                Enter your username to join the conversation
            </p>


            <form id="username-form">

                <input
                    type="text"
                    id="username-input"
                    placeholder="Enter your username"
                    maxlength="20"
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Join Chat
                </button>

            </form>

        </div>

    </div>


    <!-- ================================= -->
    <!-- Main Chat Application              -->
    <!-- ================================= -->

    <main class="chat-app" id="chat-app">


        <!-- ================================= -->
        <!-- Header                             -->
        <!-- ================================= -->

        <header class="chat-header">

            <div class="brand">

                <div class="brand-icon">
                    💬
                </div>

                <div>

                    <h2>Socket Chat</h2>

                    <span class="status">
                        <span class="status-dot"></span>
                        Real-time messaging
                    </span>

                </div>

            </div>


            <div class="online-box">

                <span class="online-dot"></span>

                <span id="online-count">
                    0
                </span>

                <span>
                    online
                </span>

            </div>

        </header>


        <!-- ================================= -->
        <!-- Messages                          -->
        <!-- ================================= -->

        <section
            class="messages-container"
            id="messages-container"
        >

            <div class="welcome-message">

                <div class="welcome-icon">
                    🚀
                </div>

                <h3>
                    Welcome to the chat!
                </h3>

                <p>
                    Start a real-time conversation.
                </p>

            </div>

        </section>


        <!-- ================================= -->
        <!-- Typing Indicator                  -->
        <!-- ================================= -->

        <div
            class="typing-container"
            id="typing-container"
        >

            <span id="typing-text"></span>

            <div class="typing-dots">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>


        <!-- ================================= -->
        <!-- Message Form                      -->
        <!-- ================================= -->

        <form
            id="message-form"
            class="message-form"
        >

            <textarea
                id="message-input"
                placeholder="Type your message..."
                rows="1"
                maxlength="500"
            ></textarea>


            <button
                type="submit"
                class="send-button"
                aria-label="Send message"
            >

                <span>Send</span>

                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                >

                    <path
                        d="M22 2L11 13"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M22 2L15 22L11 13L2 9L22 2Z"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

            </button>

        </form>


        <div class="chat-footer">

            <span>
                Press Enter to send
            </span>

            <span>
                •
            </span>

            <span>
                Shift + Enter for new line
            </span>

        </div>

    </main>


    <!-- ================================= -->
    <!-- JavaScript                         -->
    <!-- ================================= -->

    <script src="/script.js"></script>

</body>

</html>
